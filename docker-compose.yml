version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=sanctuary_db
      - POSTGRES_USER=sanctuary_user
      - POSTGRES_PASSWORD=supersecurepassword123
    ports:
      - "5432:5432"

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=replace-with-secure-production-key
      - ALLOWED_HOSTS=localhost,127.0.0.1,api.yourdomain.com
      - CORS_ALLOWED_ORIGINS=https://yourdomain.com
      - CSRF_TRUSTED_ORIGINS=https://yourdomain.com
      - DATABASE_URL=postgres://sanctuary_user:supersecurepassword123@db:5432/sanctuary_db
      - SECURE_SSL_REDIRECT=True
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass the build-time env variable (adjust as needed for dynamic config)
        - VITE_API_URL=https://api.yourdomain.com/api
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
